name: Maven Test

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: README download button matches version
        run: |
          v=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          grep -qF "releases/download/release-$v/MacroMachine-Setup-$v.exe" README.md \
            || { echo "README download button must point to MacroMachine-Setup-$v.exe"; exit 1; }
