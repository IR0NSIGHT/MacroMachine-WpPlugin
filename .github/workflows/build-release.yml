name: Build Windows Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build shaded JAR
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Read version and validate resources
        id: artifact
        shell: pwsh
        run: |
          $version = (mvn help:evaluate '-Dexpression=project.version' '-q' '-DforceStdout').Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
              throw 'Could not read the Maven project version.'
          }

          $jarPath = "target\Macro-Machine-Plugin-$version.jar"
          if (-not (Test-Path -LiteralPath $jarPath -PathType Leaf)) {
              throw "Shaded JAR was not found: $jarPath"
          }

          $entries = @(jar tf $jarPath)
          $required = @(
              'icons/action.png',
              'icons/input.png',
              'icons/invalid.png',
              'icons/macro.png',
              'icons/output.png',
              'org/pepsoft/worldpainter/icons/3dpreview.png',
              'org/pepsoft/worldpainter/icons/citytool.png',
              'org/pepsoft/worldpainter/icons/macrooperation.png',
              'org/pepsoft/worldpainter/icons/macroselectionlayer.png',
              'org/pepsoft/worldpainter/icons/roadtool.png',
              'org.pepsoft.worldpainter.plugins',
              'org.ironsight.wpplugin.macromachine.properties'
          )

          $missing = @($required | Where-Object { $entries -notcontains $_ })
          if ($missing.Count -gt 0) {
              throw "Required resources are missing: $($missing -join ', ')"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "path=$jarPath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows shaded JAR
        uses: actions/upload-artifact@v4
        with:
          name: MacroMachine-Plugin-Windows-v${{ steps.artifact.outputs.version }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Package default macros
        shell: pwsh
        run: Compress-Archive -Path defaultActions -DestinationPath default-macros.zip -Force

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MacroMachine-Release-Bundle-v${{ steps.artifact.outputs.version }}
          path: default-macros.zip
          if-no-files-found: error

      - name: Create or update named GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.artifact.outputs.version }}
          name: MacroMachine v${{ steps.artifact.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.artifact.outputs.path }}
            default-macros.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
