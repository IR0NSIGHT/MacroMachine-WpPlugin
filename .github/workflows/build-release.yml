name: Build Windows Release

# Started by merge-release.yml after the tests passed on master for this exact commit.
# It has to be a dispatch: pushes and finished runs caused by GITHUB_TOKEN don't
# start other workflows. Can also be started by hand on the release branch.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build-release:
    if: github.ref == 'refs/heads/release'
    runs-on: windows-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify tested release branch and existing tag
        shell: pwsh
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          $releaseSha = (git rev-parse refs/remotes/origin/release).Trim()
          if ($LASTEXITCODE -ne 0 -or $releaseSha -cne $env:TESTED_SHA) { throw 'Tested SHA is not the current release branch head.' }
          $version = (mvn help:evaluate '-Dexpression=project.version' '-q' '-DforceStdout').Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid release version.' }
          $tagSha = (git rev-parse "refs/tags/release-$version^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagSha -cne $env:TESTED_SHA) { throw 'Existing release tag does not point to the tested SHA.' }
          "version=$version" >> $env:GITHUB_OUTPUT
        id: release

      - name: Build shaded JAR
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Read version and validate resources
        id: artifact
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'

          $jarPath = "target\Macro-Machine-Plugin-$version.jar"
          if (-not (Test-Path -LiteralPath $jarPath -PathType Leaf)) {
              throw "Shaded JAR was not found: $jarPath"
          }

          $entries = @(jar tf $jarPath)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect shaded JAR.' }
          $required = @(
              'icons/action.png',
              'icons/input.png',
              'icons/invalid.png',
              'icons/macro.png',
              'icons/output.png',
              'org/pepsoft/worldpainter/icons/3dpreview.png',
              'org/pepsoft/worldpainter/icons/citytool.png',
              'org/pepsoft/worldpainter/icons/macrooperation.png',
              'org/pepsoft/worldpainter/icons/macroselectionlayer.png',
              'org/pepsoft/worldpainter/icons/roadtool.png',
              'org.pepsoft.worldpainter.plugins',
              'org.ironsight.wpplugin.macromachine.properties'
          )

          $missing = @($required | Where-Object { $entries -notcontains $_ })
          if ($missing.Count -gt 0) {
              throw "Required resources are missing: $($missing -join ', ')"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "path=$jarPath" >> $env:GITHUB_OUTPUT

      - name: Obtain pinned portable Inno Setup
        id: inno
        shell: pwsh
        run: |
          $iscc = & ./installer/windows/get-inno-setup.ps1 -Destination "$env:RUNNER_TEMP/inno-6.7.4"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Run installer tests and compile release
        shell: pwsh
        run: |
          ./installer/windows/tests/run-tests.ps1 -IsccPath '${{ steps.inno.outputs.iscc }}' -PluginJar '${{ steps.artifact.outputs.path }}' -Version '${{ steps.artifact.outputs.version }}'
          ./installer/windows/build-installer.ps1 -PluginJar '${{ steps.artifact.outputs.path }}' -Version '${{ steps.artifact.outputs.version }}' -IsccPath '${{ steps.inno.outputs.iscc }}' -OutputDirectory target/installer

      - name: Upload Windows shaded JAR
        uses: actions/upload-artifact@v4
        with:
          name: MacroMachine-Plugin-Windows-v${{ steps.artifact.outputs.version }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Package default macros
        shell: pwsh
        run: Compress-Archive -Path defaultActions -DestinationPath default-macros.zip -Force

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @('${{ steps.artifact.outputs.path }}', 'target/installer/MacroMachine-Setup-${{ steps.artifact.outputs.version }}.exe', 'default-macros.zip')
          $lines = foreach ($file in $files) { $item = Get-Item -LiteralPath $file; '{0}  {1}' -f (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $item.Name }
          [IO.File]::WriteAllLines((Join-Path $PWD 'SHA256SUMS.txt'), [string[]]$lines, [Text.Encoding]::ASCII)

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MacroMachine-Release-Bundle-v${{ steps.artifact.outputs.version }}
          path: |
            default-macros.zip
            target/installer/MacroMachine-Setup-${{ steps.artifact.outputs.version }}.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update named GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.artifact.outputs.version }}
          name: MacroMachine v${{ steps.artifact.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.artifact.outputs.path }}
            default-macros.zip
            target/installer/MacroMachine-Setup-${{ steps.artifact.outputs.version }}.exe
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
